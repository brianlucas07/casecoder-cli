[package]
name = "casecoder-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12.0"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
colored = "3.1.1"
rustyline = "18.0.1"
futures-util = "0.3"
